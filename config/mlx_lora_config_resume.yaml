# MLX-LM LoRA fine-tuning config — RESUME from step 1000
# Resumes from models/raft_lora_mlx/0001000_adapters.safetensors
# Runs 500 more steps (total: 1500) with HF_HUB_OFFLINE=1 to prevent CLOSE_WAIT hang

model: "mlx-community/Meta-Llama-3.1-8B-Instruct-4bit"
train: true
data: "data/finetune/mlx"

fine_tune_type: "lora"
num_layers: 4
lora_parameters:
  rank: 8
  alpha: 16
  dropout: 0.05
  scale: 10.0

# Training
batch_size: 1
grad_accumulation_steps: 4
iters: 500                        # remaining 500 steps (step 1001→1500)
learning_rate: 2e-5
optimizer: "adamw"
grad_checkpoint: true
mask_prompt: true

# Logging / checkpointing
steps_per_report: 25
steps_per_eval: 200
val_batches: 25
save_every: 500
adapter_path: "models/raft_lora_mlx"

max_seq_length: 1024
seed: 42
